<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submission #{{ submission.id }}: Code Art Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #ffffff; color: #19191c; text-align: center;
    font-family: -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  h1 { font-size: 20px; margin: 0; font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; font-weight: 800;
    color: #19191c; }
  #state { font-size: 17px; color: #6f737a; }
  #state.ok { color: #14804a; }
  #state.bad { color: #c81f4d; }
  #error { max-width: 640px; white-space: pre-wrap; text-align: left;
    background: #ffecf1; border: 1px solid #FE2857; border-radius: 6px;
    padding: 12px; font: 12px/1.5 "JetBrains Mono", "SF Mono", Menlo, monospace; color: #c81f4d;
    display: none; }
  #media { max-width: min(512px, 90vw); display: none; }
  #media img, #media video { width: 100%; border-radius: 8px;
    border: 1px solid #d8d8e0; }
  a { color: #6B57FF; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .spinner { width: 26px; height: 26px; border: 3px solid #d8d8e0;
    border-top-color: #6B57FF; border-radius: 50%;
    animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1>Submission #{{ submission.id }}: {{ submission.name }}</h1>
<div class="spinner" id="spinner"></div>
<div id="state">checking status...</div>
<pre id="error"></pre>
<div id="media"></div>
<div id="links"><a href="/">Submit another piece</a> · <a href="/wall">See the wall</a></div>

<script>
const ID = {{ submission.id }};
const MESSAGES = {
  queued: "In the render queue. Hold tight...",
  rendering: "Rendering your piece...",
  rendered: "Rendered! Waiting for a human moderator to approve it.",
  approved: "Approved. Your piece is on the wall! 🎉",
  rejected: "This piece was not approved for the wall.",
  removed: "This piece has been taken down from the wall.",
  failed: "The render failed.",
};
const DONE = new Set(["approved", "rejected", "removed", "failed"]);

function showMedia(s) {
  if (!s.media_url) return;
  const media = document.getElementById("media");
  media.innerHTML = s.kind === "animated"
    ? `<video src="${s.media_url}" autoplay muted loop playsinline></video>`
    : `<img src="${s.media_url}" alt="your piece">`;
  media.style.display = "block";
}

async function poll() {
  try {
    const resp = await fetch(`/api/submission/${ID}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const s = await resp.json();
    const state = document.getElementById("state");
    state.textContent = MESSAGES[s.status] || s.status;
    state.className = s.status === "approved" ? "ok"
      : ["failed", "rejected", "removed"].includes(s.status) ? "bad" : "";
    if (s.status === "failed" && s.error) {
      const err = document.getElementById("error");
      err.textContent = s.error;
      err.style.display = "block";
    }
    if (["rendered", "approved"].includes(s.status)) showMedia(s);
    if (s.status === "approved") {
      document.getElementById("links").innerHTML +=
        ` · <a href="/piece/${ID}">View your piece</a>`;
    }
    if (DONE.has(s.status)) {
      document.getElementById("spinner").style.display = "none";
      return;  // stop polling
    }
  } catch (e) { /* transient network error: keep polling */ }
  setTimeout(poll, 2000);
}
poll();
</script>
</body>
</html>
