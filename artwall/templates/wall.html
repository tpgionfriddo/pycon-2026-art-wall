<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Code Art Wall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* The wall alone is dark; the other four pages stay light (ADR-0006). */
        :root {
            color-scheme: dark;

            /* The QR's module area, the quiet zone around it, and the panel
               that holds both. The grid reserves the panel's width, so the
               panel may never be wider than this — which is why the address
               under the QR is capped to the same box and wraps instead. */
            --qr: clamp(128px, 15vh, 240px);
            --qr-quiet: calc(var(--qr) / 7);      /* 4 modules of a v3 symbol */
            --qr-box: calc(var(--qr) + 2 * var(--qr-quiet));
            --qr-panel: calc(var(--qr-box) + 24px);
        }

        #logo {
            width: 200px;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: black;
            color: white;
            font-family: "JetBrains Sans", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Droid Sans", "Helvetica Neue", Arial, sans-serif;
        }

        header {
            flex: none;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 18px;
            justify-content: space-between;
            color: white;
        }

        h1 {
            font-weight: 600;
            font-size: 18px;
            margin: 0;
            letter-spacing: 0.04em;
        }

        #hint {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-left: auto;
        }

        /* Every approved piece is always on screen: uniform square tiles sized
           to fill the viewport, shrinking forever as the wall grows (ADR-0005). */
        #grid {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 6px;
            /* Room for the QR panel on the left, rather than tiles behind it:
               ADR-0005 keeps "nothing is ever hidden" exactly, and on a wide
               screen the tile size is usually height-bound anyway, so the
               reservation costs the pieces nothing. `layout()` reads this back
               rather than assuming it. */
            padding: 6px 6px 6px calc(var(--qr-panel) + 20px);
        }

        .tile {
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
            width: var(--tile, 240px);
            height: var(--tile, 240px);
            border-radius: 6px;

            display: block;
            transition: width 0.5s, height 0.5s;
        }

        .tile img, .tile video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .tile .by {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 10px 8px 6px;
            font-size: 12px;
            color: white;
        }

        #empty {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6f737a;
            pointer-events: none;
        }

        /* The wall is the only invitation an attendee gets, so the Submit URL
           never scrolls away: the bottom-left corner, in space the grid
           reserves for it. It is decoration in front of links, so it takes no
           clicks of its own. */
        #submit-url {
            position: fixed;
            left: 14px;
            bottom: 14px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.72);
        }

        /* The QR is encoded without its quiet zone — this white padding is
           that zone, and a scanner needs all four modules of it. */
        #qr {
            display: block;
            width: var(--qr);
            aspect-ratio: 1;
            height: auto;
            padding: var(--qr-quiet);
            border-radius: 6px;
            background: white;
        }

        /* Capped to the QR's box, so a long address wraps rather than widen
           the panel past the column the grid reserved for it. The size is
           taken off the QR for the same reason: it keeps the default address
           on one line at any screen size. */
        #submit-url-text {
            max-width: var(--qr-box);
            font-family: "JetBrains Mono", ui-monospace, monospace;
            font-size: calc(var(--qr) / 12);
            letter-spacing: 0.02em;
            text-align: center;
            overflow-wrap: anywhere;
            color: white;
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            background: #e6f9ef;
            border: 1px solid #21D789;
            color: #14804a;
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
<header>
    <img src="/static/PyCharm-white.svg" alt="PyCharm logo." id="logo">
    <div>

    <h1>
        PyCharm art wall
    </h1>
    <span id="hint" >Write Python. Make art. Scan the QR to submit.</span>
    </div>
</header>
<div id="grid"></div>
<aside id="submit-url">
    <img src="/qr.svg" alt="QR code to the submission page." id="qr">
    <span id="submit-url-text">{{ submit_url_shown }}</span>
</aside>
<div id="empty">No pieces yet — be the first on the wall!</div>
<div id="toast"></div>

<script>
    const grid = document.getElementById("grid");
    const known = new Set();
    let toastTimer = null;

    function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 5000);
    }

    function addTile(piece, announce) {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = `/piece/${piece.id}`;
        a.innerHTML = piece.kind === "animated"
            ? `<video src="${piece.media_url}" autoplay muted loop playsinline></video>`
            : `<img src="${piece.media_url}" alt="" loading="lazy">`;
        if (piece.byline) {                 // cleared byline: no credit at all
            const by = document.createElement("div");
            by.className = "by";
            by.textContent = piece.byline;
            a.appendChild(by);
        }
        grid.appendChild(a);
        known.add(piece.id);
        if (announce) {
            toast(piece.byline ? `New piece by ${piece.byline}!`
                               : "A new piece is on the wall!");
        }
    }

    function layout() {
        // largest uniform square size such that all n tiles fit the grid area
        const n = known.size;
        if (!n) return;
        const gap = 6;
        const box = getComputedStyle(grid);      // the QR's column is padding
        const W = grid.clientWidth
            - parseFloat(box.paddingLeft) - parseFloat(box.paddingRight);
        const H = grid.clientHeight
            - parseFloat(box.paddingTop) - parseFloat(box.paddingBottom);
        let best = 0;
        for (let cols = 1; cols <= n; cols++) {
            const rows = Math.ceil(n / cols);
            const size = Math.min((W - (cols - 1) * gap) / cols,
                (H - (rows - 1) * gap) / rows);
            if (size > best) best = size;
        }
        grid.style.setProperty("--tile", `${Math.floor(best)}px`);
    }

    window.addEventListener("resize", layout);

    async function poll(first) {
        try {
            const resp = await fetch("/api/wall");
            const {pieces} = await resp.json();
            for (const piece of pieces) {
                if (!known.has(piece.id)) addTile(piece, !first);
            }
            document.getElementById("empty").style.display = known.size ? "none" : "";
            layout();
        } catch (e) { /* flaky booth network: keep polling */
        }
        setTimeout(() => poll(false), 5000);
    }

    poll(true);
</script>
</body>
</html>
