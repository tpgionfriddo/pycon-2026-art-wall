<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if piece.byline %}{{ piece.byline }}: {% endif %}Code Art Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #ffffff; color: #19191c; padding: 20px;
    font-family: -apple-system, "Segoe UI", sans-serif; }
  #frame { width: min(85vmin, 900px); }
  #frame img, #frame video { width: 100%; border-radius: 10px;
    border: 1px solid #d8d8e0; display: block; }
  #source { width: 100%; max-height: 85vmin; overflow: auto; margin: 0;
    background: #f7f7fa; border: 1px solid #d8d8e0; border-radius: 10px;
    padding: 16px; font: 13px/1.5 "JetBrains Mono", "SF Mono", Menlo, monospace;
    color: #19191c; box-sizing: border-box; display: none; }
  h1 { font-size: 18px; margin: 0; font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; font-weight: 800;
    color: #19191c; }
  h1 span { color: #6f737a; }
  button { background: #ffffff; color: #6B57FF; border: 1px solid #6B57FF;
    border-radius: 6px; padding: 7px 16px; font-size: 13px; cursor: pointer; font-weight: 600; }
  button:hover { background: #6B57FF; color: #ffffff; }
  a { color: #6B57FF; font-size: 13px; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="frame">
  {% if piece.kind == "animated" %}
  <video src="{{ piece.media_url }}" autoplay muted loop playsinline></video>
  {% else %}
  <img src="{{ piece.media_url }}" alt="{% if piece.byline %}piece by {{ piece.byline }}{% else %}an unattributed piece{% endif %}">
  {% endif %}
  <pre id="source">{{ code }}</pre>
</div>
{% if piece.byline %}<h1><span>by</span> {{ piece.byline }}</h1>{% endif %}
<button id="flip">Show the source</button>
<a href="/wall">← back to the wall</a>

<script>
const media = document.querySelector("#frame video, #frame img");
const source = document.getElementById("source");
const flip = document.getElementById("flip");
flip.addEventListener("click", () => {
  const showingCode = source.style.display === "block";
  source.style.display = showingCode ? "none" : "block";
  media.style.display = showingCode ? "block" : "none";
  flip.textContent = showingCode ? "Show the source" : "Show the piece";
});
</script>
</body>
</html>
