# The whole stack: the submission server, one render worker, and the sandbox
# image the worker starts each job in. Identical on the booth laptop and on
# the VPS (ADR-0004) — everything that differs lives in `.env`.
#
#   cp .env.example .env          # then set ARTWALL_ADMIN_PASSWORD
#   docker compose build sandbox-image
#   docker compose up -d --build
name: artwall

x-app: &app
  image: artwall-app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &app-env
    ARTWALL_DATA_DIR: /data

services:

  # Build-only. This produces the sandbox image in the host daemon under the
  # tag the worker starts containers from; it is not a service and must never
  # be started as one, so it sits behind a profile that nothing enables.
  # Build it explicitly: `docker compose build sandbox-image`.
  sandbox-image:
    image: ${ARTWALL_WORKER_IMAGE:-artwall-worker}
    build:
      context: .
      dockerfile: worker/Dockerfile
    profiles: [build-only]
    pull_policy: build

  server:
    <<: *app
    command: >
      uvicorn artwall.server:create_app --factory
      --host 0.0.0.0 --port 8000
    environment:
      <<: *app-env
      # Unset locks the admin pages silently, which is only discovered at
      # the moment someone needs to moderate. Fail the stack instead.
      ARTWALL_ADMIN_PASSWORD: ${ARTWALL_ADMIN_PASSWORD:?set it in .env}
    ports:
      - "${ARTWALL_PORT:-8000}:8000"
    volumes:
      - ${ARTWALL_DATA_DIR:-./data}:/data

  worker:
    <<: *app
    command: python -m artwall.worker
    environment:
      <<: *app-env
      ARTWALL_WORKER_IMAGE: ${ARTWALL_WORKER_IMAGE:-artwall-worker}
      # Bind-mount sources are resolved by the daemon on the host, so a job's
      # scratch has to name the same directory here and there (issue 04). The
      # single variable below is both sides of that mount on purpose.
      ARTWALL_SCRATCH_DIR: ${ARTWALL_SCRATCH_DIR:-/tmp/artwall-scratch}
    volumes:
      - ${ARTWALL_DATA_DIR:-./data}:/data
      # The worker drives the host daemon rather than running one of its
      # own. ADR-0002 describes the worker as host-side; this changes that.
      - ${ARTWALL_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ${ARTWALL_SCRATCH_DIR:-/tmp/artwall-scratch}:${ARTWALL_SCRATCH_DIR:-/tmp/artwall-scratch}
