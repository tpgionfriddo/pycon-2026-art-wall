# The whole stack: a reverse proxy, the submission server, one render worker,
# and the sandbox image the worker starts each job in. Identical on the booth
# laptop and on the VPS (ADR-0004) — everything that differs lives in `.env`
# locally, and in the Portainer stack's environment variables in production.
#
#   cp .env.example .env          # then set ARTWALL_ADMIN_PASSWORD
#   docker compose build sandbox-image
#   docker compose up -d --build
#
# See README.md, "Deploying to the VPS", for the production side.
name: artwall

x-app: &app
  image: artwall-app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &app-env
    ARTWALL_DATA_DIR: /data

services:

  # Build-only. This produces the sandbox image in the host daemon under the
  # tag the worker starts containers from; it is not a service and must never
  # be started as one, so it sits behind a profile that nothing enables.
  # Build it explicitly: `docker compose build sandbox-image`.
  sandbox-image:
    image: ${ARTWALL_WORKER_IMAGE:-artwall-worker}
    build:
      context: .
      dockerfile: worker/Dockerfile
    profiles: [build-only]
    pull_policy: build

  # The only service published to the network: it terminates TLS in front of
  # the server, obtaining and renewing the certificate itself whenever the
  # site address it is given is a domain rather than a bare port. Its
  # configuration is baked into its image rather than mounted from here —
  # see `proxy/Caddyfile`, and `proxy/Dockerfile` for why.
  proxy:
    image: artwall-proxy
    build:
      context: ./proxy
    restart: unless-stopped
    depends_on: [server]
    environment:
      ARTWALL_SITE_ADDRESS: ${ARTWALL_SITE_ADDRESS:-:80}
    ports:
      - "${ARTWALL_HTTP_PORT:-80}:80"
      - "${ARTWALL_HTTPS_PORT:-443}:443"
      # HTTP/3, which Caddy advertises the moment it is serving TLS. Without
      # the UDP port a phone tries QUIC, fails, and falls back to TCP.
      - "${ARTWALL_HTTPS_PORT:-443}:443/udp"
    volumes:
      # Issued certificates. A named volume rather than a bind mount because
      # nobody edits these by hand, and losing them on redeploy would mean
      # re-issuing from Let's Encrypt on every deployment.
      - caddy-data:/data
      - caddy-config:/config

  server:
    <<: *app
    # `--proxy-headers` with every source trusted: nothing but the proxy can
    # reach this port, since the proxy is what publishes ports, and it hands
    # over an X-Forwarded-For it wrote itself (see `proxy/Caddyfile`).
    # Without this the rate limit sees the proxy's address for every attendee
    # and the whole booth shares one bucket.
    command: >
      uvicorn artwall.server:create_app --factory
      --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips '*'
    environment:
      <<: *app-env
      # Unset locks the admin pages silently, which is only discovered at
      # the moment someone needs to moderate. Fail the stack instead.
      ARTWALL_ADMIN_PASSWORD: ${ARTWALL_ADMIN_PASSWORD:?set it in .env}
      # The per-address submission ceiling, here rather than in `*app-env`
      # because the worker has no limiter. Answering a jammed booth is a
      # stack change and a restart, which also clears every bucket.
      ARTWALL_RATE_LIMIT_MAX: ${ARTWALL_RATE_LIMIT_MAX:-60}
      ARTWALL_RATE_LIMIT_WINDOW_S: ${ARTWALL_RATE_LIMIT_WINDOW_S:-600}
      # The other two guards the server alone applies: how deep the queue may
      # get before it refuses, and how large one submission may be. Here for
      # the same reason as the limiter, and the worker reads neither.
      ARTWALL_MAX_QUEUE_DEPTH: ${ARTWALL_MAX_QUEUE_DEPTH:-100}
      ARTWALL_MAX_CODE_BYTES: ${ARTWALL_MAX_CODE_BYTES:-32768}
    volumes:
      - ${ARTWALL_DATA_DIR:-./data}:/data

  worker:
    <<: *app
    command: python -m artwall.worker
    environment:
      <<: *app-env
      ARTWALL_WORKER_IMAGE: ${ARTWALL_WORKER_IMAGE:-artwall-worker}
      # Bind-mount sources are resolved by the daemon on the host, so a job's
      # scratch has to name the same directory here and there (issue 04). The
      # single variable below is both sides of that mount on purpose.
      ARTWALL_SCRATCH_DIR: ${ARTWALL_SCRATCH_DIR:-/tmp/artwall-scratch}
      # How long one render may take before it is killed, and how often the
      # queue is checked when it was empty. Both are the worker's alone. The
      # ceiling is the dial to reach for when good pieces are being killed:
      # raise it here and restart the worker, no redeploy.
      ARTWALL_RENDER_TIMEOUT_S: ${ARTWALL_RENDER_TIMEOUT_S:-180}
      # How many CPUs one render may use. Two, because an animated piece
      # draws and encodes as two processes through a pipe and a one-CPU cap
      # serialises them. Only ever one render at a time, so this is the whole
      # of rendering's claim on the host. Lower it on a two-core box, where
      # the server and the proxy need what is left.
      ARTWALL_RENDER_CPUS: ${ARTWALL_RENDER_CPUS:-2.0}
      ARTWALL_POLL_INTERVAL_S: ${ARTWALL_POLL_INTERVAL_S:-2.0}
    volumes:
      - ${ARTWALL_DATA_DIR:-./data}:/data
      # The worker drives the host daemon rather than running one of its
      # own. ADR-0002 describes the worker as host-side; ADR-0007 records
      # this shape, and why a privileged daemon-in-a-daemon was not used.
      - ${ARTWALL_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ${ARTWALL_SCRATCH_DIR:-/tmp/artwall-scratch}:${ARTWALL_SCRATCH_DIR:-/tmp/artwall-scratch}

volumes:
  caddy-data:
  caddy-config:
