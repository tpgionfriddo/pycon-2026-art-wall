[project]
name = "art-wall"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "colour>=0.1.5",
    "fastapi>=0.140.7",
    "ipywidgets>=8.1.8",
    "jinja2>=3.1.6",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "shapely>=2.1.2",
    "svgpathtools>=1.7.2",
    "trimesh>=4.12.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
# The post-event gallery generator alone (`python -m artwall.gallery`), which
# runs on somebody's laptop and never inside the application image. Kept out
# of the runtime dependencies for that reason: the server has no use for a
# syntax highlighter.
gallery = [
    "pygments>=2.19.1",
]
